# 网关鉴权
gateway:
  auth:
    secret: monkey-iam-jwt-secret-key-2024-dev
    public-paths:
      - /iam/auth/register
      - /iam/auth/login
      - /swagger-ui
      - /webjars
      - /iam/v3/api-docs
      - /catalog/v3/api-docs
      - /inventory/v3/api-docs
      - /order/v3/api-docs
      - /catalog/products

# SpringDoc 聚合 Swagger UI
springdoc:
  swagger-ui:
    urls:
      - name: 认证服务
        url: /api/iam/v3/api-docs
      - name: 产品服务
        url: /api/catalog/v3/api-docs
      - name: 库存服务
        url: /api/inventory/v3/api-docs
      - name: 订单服务
        url: /api/order/v3/api-docs

logging:
  level:
    org.monkey.gateway: DEBUG
    org.springframework.cloud.gateway: INFO