# ================================================================
# gateway-service —— 开发环境配置
# ================================================================

server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: iam-service
              uri: lb://iam-service
              predicates:
                - Path=/api/iam/**
              filters:
                - StripPrefix=1
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=1
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1
            - id: agent-server
              uri: http://localhost:9000
              predicates:
                - Path=/api/mcp1/**
              filters:
                - StripPrefix=1
            - id: mcp-server
              uri: lb://mcp-server
              predicates:
                - Path=/api/sse,/api/mcp/message
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: 300s
                connect-timeout: 5000

            - id: test-service
              uri: lb://test-service
              predicates:
                - Path=/api/test/**
              filters:
                - StripPrefix=1
