# ================================================================
# mvp-server —— mcp server 服务配置
# ================================================================

server:
  port: 8130

spring:
  ai:
    openai:
      api-key:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml    # mapper.xml 路径（复杂 SQL 时使用）
  configuration:
    map-underscore-to-camel-case: true             # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL 日志
  global-config:
    db-config:
      id-type: auto

# 日志
logging:
  level:
    org.springframework.ai: DEBUG
    io.modelcontextprotocol: DEBUG